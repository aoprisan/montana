<meta name="theme-color" content="#1f2a1d">

<style>
:root{
  --forest:#072d23;
  --forest-2:#0a382b;
  --paper:#f4f3ee;
  --paper-2:#ebece6;
  --ink:#092a21;
  --ink-soft:#66716c;
  --line:#b9c0ba;
  --line-dark:#365147;
  --orange:#ef4d18;
  --blue:#285ea8;
  --yellow:#b98b10;
  --white:#fbfcf8;
  --disp:"Big Shoulders Display","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:15px;line-height:1.45;
}
a{color:inherit}
button,input{font:inherit}
button{color:inherit}
.wrap{width:min(100% - 64px,1360px);margin-inline:auto}
.icon{width:20px;height:20px;display:block;flex:0 0 auto}

header.site{
  min-height:344px;color:var(--white);position:relative;overflow:hidden;
  background-color:var(--forest);
  background-image:
    repeating-radial-gradient(ellipse 520px 210px at 10% 18%,transparent 0 27px,rgba(223,176,80,.10) 28px 29px),
    repeating-radial-gradient(ellipse 700px 290px at 88% 72%,transparent 0 34px,rgba(223,176,80,.08) 35px 36px);
}
header.site::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.08),transparent 45%,rgba(0,0,0,.05));pointer-events:none}
.header-inner{position:relative;z-index:1;padding:28px 0 34px}
.brand{display:flex;align-items:center;gap:16px;font:700 clamp(25px,2.5vw,38px)/1 var(--disp);letter-spacing:.02em;text-transform:uppercase}
.blaze-mark{display:grid;grid-template-columns:repeat(3,1fr);width:51px;height:51px;border:1px solid rgba(255,255,255,.72);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.blaze-mark i:nth-child(1){background:#e62226}.blaze-mark i:nth-child(2){background:#fff}.blaze-mark i:nth-child(3){background:#183f86}
.hero{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(370px,.85fr);gap:72px;align-items:end;margin-top:36px}
.hero-copy h1{font:800 clamp(56px,6vw,94px)/.86 var(--disp);letter-spacing:.005em;text-transform:uppercase;margin:0;max-width:860px}
.hero-copy p{font-size:clamp(16px,1.35vw,22px);line-height:1.5;margin:22px 0 0;max-width:690px;color:#dde5df}
.next-race{border-left:1px solid rgba(255,255,255,.75);padding:6px 0 3px 54px;min-height:190px}
.next-label{font:600 15px/1 var(--disp);text-transform:uppercase;letter-spacing:.07em;color:#acbab4;margin-bottom:16px}
.next-race h2{font:700 clamp(25px,2.25vw,38px)/1 var(--disp);text-transform:uppercase;margin:0 0 14px;color:var(--orange)}
.next-meta{display:grid;gap:9px;color:#e9eee9;font-size:14px;font-weight:500;text-transform:uppercase}
.next-meta span{display:flex;align-items:center;gap:10px}
.next-link{display:inline-flex;align-items:center;gap:8px;margin-top:16px;color:var(--orange);font:700 16px var(--disp);letter-spacing:.04em;text-transform:uppercase;text-decoration:none}
.next-link:hover{text-decoration:underline;text-underline-offset:4px}

.filters{position:sticky;top:0;z-index:20;background:rgba(244,243,238,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.filter-row{min-height:106px;display:flex;align-items:center;gap:12px}
.searchbox{width:min(330px,26vw);height:54px;display:flex;align-items:center;gap:13px;border:1px solid var(--ink);padding:0 16px;background:var(--white)}
.searchbox:focus-within{outline:3px solid color-mix(in srgb,var(--orange) 28%,transparent);border-color:var(--orange)}
input[type=search]{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:14px}
input[type=search]::placeholder{color:#78827d}
.chip{height:48px;border:1px solid #6e7772;background:transparent;border-radius:0;padding:0 17px;font:700 15px var(--disp);text-transform:uppercase;cursor:pointer;transition:.16s ease}
.chip:hover{border-color:var(--ink);transform:translateY(-1px)}
.chip[aria-pressed=true]{background:var(--forest);border-color:var(--forest);color:var(--white)}
.chip:focus-visible,.toggle:focus-visible,.month-btn:focus-visible{outline:3px solid color-mix(in srgb,var(--orange) 36%,transparent);outline-offset:2px}
.toggles{display:flex;align-items:center;gap:24px;margin-left:auto}
.toggle{display:flex;align-items:center;gap:11px;border:0;background:none;padding:10px 0;white-space:nowrap;cursor:pointer;font-size:13px}
.switch{width:48px;height:25px;border:1px solid var(--ink);background:transparent;border-radius:99px;position:relative;transition:.18s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--ink);transition:.18s}
.toggle[aria-pressed=true] .switch{background:var(--forest)}
.toggle[aria-pressed=true] .switch::after{transform:translateX(23px);background:var(--white)}

.month-rail{border-bottom:1px solid var(--line);background:var(--paper)}
.month-rail-inner{min-height:132px;display:grid;grid-template-columns:140px 1fr;align-items:center;gap:22px}
.count{font:700 28px var(--disp);text-transform:uppercase;letter-spacing:.02em}
.count small{display:block;margin-top:4px;font:500 10px var(--mono);color:var(--ink-soft);letter-spacing:.05em}
.months{display:grid;grid-template-columns:repeat(12,minmax(54px,1fr));align-self:stretch}
.month-btn{position:relative;border:0;background:transparent;padding:28px 4px 20px;cursor:pointer;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px;font:700 16px var(--disp);text-transform:uppercase}
.month-btn:disabled{cursor:default;opacity:.34}
.month-btn:not(:disabled):hover{color:var(--orange)}
.month-btn.is-current{color:var(--ink)}
.month-btn.is-current::after{content:"";position:absolute;bottom:15px;width:34px;height:3px;background:var(--orange)}
.density{height:28px;display:flex;gap:2px;align-items:flex-end}
.density i{display:block;width:4px;background:currentColor;min-height:3px}
.month-num{font:500 11px var(--mono);margin-top:5px}

main{padding-top:12px;padding-bottom:50px}
.month{scroll-margin-top:120px;margin-top:34px}
.month-head{display:flex;align-items:baseline;gap:28px;padding:0 10px 8px;border-bottom:1px solid var(--ink)}
.month-head h2{font:800 50px/1 var(--disp);text-transform:uppercase;margin:0;letter-spacing:.02em}
.month-head .n{font:700 15px var(--disp);color:var(--orange);text-transform:uppercase;letter-spacing:.05em}
.ev{display:grid;grid-template-columns:130px minmax(250px,1.35fr) minmax(220px,.9fr) minmax(210px,.9fr) minmax(110px,.45fr) 42px;align-items:center;min-height:78px;padding:12px 10px;border-bottom:1px solid var(--line);transition:background .16s,color .16s;position:relative}
.ev:hover{background:var(--paper-2)}
.ev.cancelled{color:#77817c}
.date{display:flex;align-items:baseline;gap:14px;font-family:var(--disp);text-transform:uppercase}
.date .dd{font-size:33px;font-weight:800;line-height:1}
.date .rng{font-size:14px;font-weight:600;color:var(--ink-soft)}
.ev h3{margin:0;font:700 21px/1.15 var(--disp);letter-spacing:.005em}
.ev h3 a{text-decoration:none}
.ev h3 a::after{content:"";position:absolute;inset:0;z-index:1}
.ev:hover h3 a{color:var(--orange)}
.meta,.dist{display:flex;align-items:center;gap:9px;color:var(--ink-soft);font-size:13px;padding-right:16px}
.meta .icon,.dist .icon{width:18px;height:18px;color:var(--ink)}
.cty{font:500 11px var(--mono)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font:700 10px var(--body);text-transform:uppercase;letter-spacing:.04em;padding:3px 7px;border:1px solid var(--ink);color:var(--ink)}
.tag.t-ultra{border-color:var(--orange);color:var(--orange)}
.tag.t-sky,.tag.t-vertical{border-color:var(--blue);color:var(--blue)}
.tag.t-iarnă,.tag.t-noapte{border-color:var(--ink-soft);color:var(--ink-soft)}
.tag.t-campionat{border-color:var(--yellow);color:#806000}
.status{font:700 11px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--orange)}
.ev.cancelled h3,.ev.cancelled .dist{text-decoration:line-through;text-decoration-color:var(--orange)}
.note{grid-column:2/6;font-size:11px;color:#856814;margin-top:3px}
.out{display:flex;justify-content:flex-end;color:var(--ink);text-decoration:none;position:relative;z-index:2}
.out .icon{transition:transform .16s}
.ev:hover .out .icon{transform:translate(3px,-3px);color:var(--orange)}
.empty{margin:70px 0;text-align:center;color:var(--ink-soft);font-size:16px}
.empty strong{display:block;font:700 34px var(--disp);color:var(--ink);margin-bottom:8px;text-transform:uppercase}

footer{background:var(--forest);color:#b7c2bd;padding:26px 0;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.footer-inner{display:flex;justify-content:space-between;gap:30px}
footer p{margin:0}footer a{color:var(--white);text-underline-offset:3px}

@media (max-width:1080px){
  .wrap{width:min(100% - 40px,1360px)}
  .hero{grid-template-columns:1fr 340px;gap:40px}.next-race{padding-left:34px}
  .filter-row{flex-wrap:wrap;padding:16px 0}.searchbox{width:100%}.toggles{margin-left:0}.filters{position:relative}
  .ev{grid-template-columns:105px minmax(230px,1.2fr) minmax(190px,.85fr) minmax(180px,.8fr) 42px}.tags{grid-column:2/5;margin-top:6px}.note{grid-column:2/5}.out{grid-column:5;grid-row:1/3}
}
@media (max-width:760px){
  .wrap{width:min(100% - 28px,1360px)}
  header.site{min-height:0}.header-inner{padding:20px 0 28px}.blaze-mark{width:40px;height:40px}.brand{gap:12px}
  .hero{display:block;margin-top:38px}.hero-copy h1{font-size:clamp(51px,16vw,78px)}.hero-copy p{font-size:15px;margin-top:16px}
  .next-race{margin-top:32px;border-left:0;border-top:1px solid rgba(255,255,255,.6);padding:23px 0 0;min-height:0}.next-race h2{font-size:28px}.next-meta{grid-template-columns:1fr 1fr;font-size:12px}
  .filter-row{display:grid;grid-template-columns:1fr;gap:12px}.searchbox{width:100%}.filter-chips{display:flex;overflow-x:auto;gap:8px;padding-bottom:4px;scrollbar-width:none}.filter-chips::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;height:44px}.toggles{justify-content:space-between;gap:10px}
  .month-rail-inner{display:block;padding:17px 0 0}.count{font-size:24px}.months{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -14px;padding:0 14px;scrollbar-width:none}.months::-webkit-scrollbar{display:none}.month-btn{min-width:68px;height:95px;padding:12px 4px 20px;scroll-snap-align:start}.month-btn.is-current::after{bottom:12px}
  main{padding-top:2px}.month{margin-top:30px}.month-head{padding:0 0 8px;gap:16px}.month-head h2{font-size:39px}.month-head .n{font-size:13px}
  .ev{grid-template-columns:68px 1fr 32px;align-items:start;min-height:0;padding:18px 0;gap:0 10px}.date{display:block}.date .dd{display:block;font-size:29px}.date .rng{font-size:12px}.ev h3{font-size:21px;padding-right:6px}.meta,.dist{grid-column:2;gap:7px;margin-top:8px;padding:0}.tags{grid-column:2;grid-row:auto;margin-top:10px}.note{grid-column:2/4;margin-top:8px}.out{grid-column:3;grid-row:1/4}.status{grid-column:2;margin-top:8px}.footer-inner{display:block}.footer-inner p+p{margin-top:10px}
}
@media (max-width:420px){.next-meta{grid-template-columns:1fr}.toggles{align-items:flex-start;flex-direction:column}.toggle{width:100%;justify-content:space-between}.hero-copy h1{font-size:50px}}
</style>
</head>
<body>
<header class="site">

    </div>
    <div class="toggles">
      <button class="toggle" id="onlyUpcoming" aria-pressed="true"><span>Doar viitoare</span><span class="switch" aria-hidden="true"></span></button>
      <button class="toggle" id="showCancelled" aria-pressed="true"><span>Arată anulate</span><span class="switch" aria-hidden="true"></span></button>

</div>

<nav class="month-rail" aria-label="Navigare pe luni">

    <div class="months" id="months"></div>
  </div>
</nav>

<main class="wrap" id="list" aria-live="polite"></main>

<footer>
  <div class="wrap footer-inner">
    <p>Surse: <a href="https://vladcarbune.ro/calendar-evenimente-alergare-2026/" rel="noopener">Vlad Cărbune</a>, <a href="https://www.fra.ro/competitii/calendar" rel="noopener">FRA</a> și <a href="https://runmap.ro" rel="noopener">RunMap</a>. Verifică pagina oficială înainte de cursă.</p>
    <p id="gen"></p>
  </div>
</footer>

<script>
const MONTHS=["Ianuarie","Februarie","Martie","Aprilie","Mai","Iunie","Iulie","August","Septembrie","Octombrie","Noiembrie","Decembrie"];
const MON_SHORT=["IAN","FEB","MAR","APR","MAI","IUN","IUL","AUG","SEP","OCT","NOI","DEC"];
let DATA={events:[]};
const state={q:"",tags:new Set(),onlyUpcoming:true,showCancelled:true};
const now=new Date();
const today=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;

const ICONS={
  location:'<svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="1.7"/></svg>',
  mountain:'<svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m2.5 19 6.2-10 3.1 4.7L15.7 7l5.8 12h-19Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="miter"/><path d="m7.1 11.6 1.7 1.2 1.4-1.1m4.2-2.3 1.6 1.4 1.5-1" stroke="currentColor" stroke-width="1.4"/></svg>',
  calendar:'<svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 4.5h14a2 2 0 0 1 2 2V20H3V6.5a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.7"/><path d="M7 2v5M17 2v5M3 9h18" stroke="currentColor" stroke-width="1.7"/></svg>',
  out:'<svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg>'
};

const fmt=d=>{const [y,m,day]=d.split("-");return {m:+m-1,day:+day};};
function rangeLabel(e){
  const a=fmt(e.d);
  if(!e.d2) return null;
  const b=fmt(e.d2);
  return (a.m===b.m)?`${a.day}–${b.day} ${MON_SHORT[a.m]}`:`${a.day} ${MON_SHORT[a.m]} – ${b.day} ${MON_SHORT[b.m]}`;
}
function matches(e){
  if(state.onlyUpcoming && (e.d2||e.d)<today) return false;
  if(!state.showCancelled && e.status==="anulat") return false;
  if(state.tags.size && ![...state.tags].every(t=>(e.tags||[]).includes(t))) return false;
  if(state.q){
    const hay=(e.name+" "+e.loc+" "+e.county+" "+(e.dist||"")+" "+(e.tags||[]).join(" ")).toLowerCase();
    if(!hay.includes(state.q)) return false;
  }
  return true;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function dateLong(e){
  return new Intl.DateTimeFormat("ro-RO",{day:"2-digit",month:"short",year:"numeric",weekday:"long"})
    .format(new Date(`${e.d}T12:00:00`)).replace(".","");
}
function renderNextRace(){
  const next=DATA.events.filter(e=>(e.d2||e.d)>=today&&e.status!=="anulat").sort((a,b)=>a.d.localeCompare(b.d))[0];
  const el=document.getElementById("nextRace");
  if(!next){el.hidden=true;return;}
  el.innerHTML=`<div class="next-label">Următoarea cursă</div>
    <h2>${esc(next.name)}</h2>
    <div class="next-meta">
      <span>${ICONS.calendar}${esc(dateLong(next))}</span>
      <span>${ICONS.location}${esc(next.loc)}, ${esc(next.county)}</span>
      <span>${ICONS.mountain}${esc(next.dist||"Distanțe pe site")}</span>
    </div>
    <a class="next-link" href="${esc(next.url)}" target="_blank" rel="noopener">Vezi detalii oficiale ${ICONS.out}</a>`;
}
function render(){
  const list=document.getElementById("list");
  const evs=DATA.events.filter(matches).sort((a,b)=>a.d.localeCompare(b.d));
  const byM=new Map();
  evs.forEach(e=>{const m=fmt(e.d).m;(byM.get(m)||byM.set(m,[]).get(m)).push(e);});
  let html="";
  for(const [m,items] of [...byM.entries()].sort((a,b)=>a[0]-b[0])){
    html+=`<section class="month" id="m${m}"><header class="month-head"><h2>${MONTHS[m]}</h2><span class="n">${items.length} ${items.length===1?"cursă":"curse"}</span></header>`;
    for(const e of items){
      const a=fmt(e.d), rng=rangeLabel(e), canc=e.status==="anulat";
      html+=`<article class="ev${canc?" cancelled":""}">
        <div class="date"><span class="dd">${String(a.day).padStart(2,"0")}</span><span class="rng">${rng?esc(rng):MON_SHORT[a.m]}</span></div>
        <h3><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.name)}</a></h3>
        <div class="meta">${ICONS.location}<span>${esc(e.loc)}, <span class="cty">${esc(e.county)}</span></span></div>
        ${e.dist?`<div class="dist">${ICONS.mountain}<span>${esc(e.dist)}</span></div>`:`<div></div>`}
        ${canc?`<span class="status">Anulat</span>`:(e.tags&&e.tags.length)?`<div class="tags">${e.tags.map(t=>`<span class="tag t-${esc(t)}">${esc(t)}</span>`).join("")}</div>`:`<div></div>`}
        <a class="out" href="${esc(e.url)}" target="_blank" rel="noopener" aria-label="Pagina oficială: ${esc(e.name)}">${ICONS.out}</a>
        ${e.note?`<div class="note">Atenție: ${esc(e.note)}</div>`:""}
      </article>`;
    }
    html+="</section>";
  }
  list.innerHTML=html||`<p class="empty"><strong>Nicio cursă găsită</strong>Șterge căutarea sau dezactivează un filtru.</p>`;
  const tot=DATA.events.length;
  document.getElementById("count").innerHTML=`${evs.length} ${evs.length===1?"cursă":"curse"}<small>din ${tot} în calendar</small>`;
  drawMonths(evs);
}
function drawMonths(evs){
  const nav=document.getElementById("months");
  const counts=Array.from({length:12},()=>0);
  evs.forEach(e=>counts[fmt(e.d).m]++);
  const max=Math.max(...counts,1);
  nav.innerHTML=counts.map((c,i)=>{
    const bars=Array.from({length:4},(_,j)=>`<i style="height:${c?Math.max(4,Math.round((c/max)*24)-(j%2)*4):3}px"></i>`).join("");
    const current=i===now.getMonth();
    return `<button class="month-btn${current?" is-current":""}" data-m="${i}" ${c?"":"disabled"} aria-label="${MONTHS[i]}, ${c} ${c===1?"cursă":"curse"}"><span class="density" aria-hidden="true">${bars}</span><span>${MON_SHORT[i]}</span><span class="month-num">${c}</span></button>`;
  }).join("");
  nav.querySelectorAll(".month-btn:not(:disabled)").forEach(button=>{
    button.addEventListener("click",()=>document.getElementById("m"+button.dataset.m)?.scrollIntoView({block:"start"}));
  });
}
document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value.trim().toLowerCase();render();});
document.querySelectorAll(".chip[data-tag]").forEach(b=>b.addEventListener("click",()=>{
  const t=b.dataset.tag, on=b.getAttribute("aria-pressed")==="true";
  b.setAttribute("aria-pressed",String(!on));
  on?state.tags.delete(t):state.tags.add(t);
  document.getElementById("allTags").setAttribute("aria-pressed",String(state.tags.size===0));
  render();
}));
document.getElementById("allTags").addEventListener("click",()=>{
  state.tags.clear();
  document.querySelectorAll(".chip[data-tag]").forEach(b=>b.setAttribute("aria-pressed","false"));
  document.getElementById("allTags").setAttribute("aria-pressed","true");
  render();
});
document.getElementById("showCancelled").addEventListener("click",e=>{
  state.showCancelled=!state.showCancelled;
  e.currentTarget.setAttribute("aria-pressed",String(state.showCancelled));render();
});
document.getElementById("onlyUpcoming").addEventListener("click",e=>{
  state.onlyUpcoming=!state.onlyUpcoming;
  e.currentTarget.setAttribute("aria-pressed",String(state.onlyUpcoming));render();
});
async function loadData(){
  const fallback=JSON.parse(document.getElementById("data").textContent);
  if(typeof location!=="undefined"&&location.protocol==="file:") return fallback;
  try{
    const response=await fetch("events.json",{cache:"no-store"});
    if(!response.ok) throw new Error(`events.json: ${response.status}`);
    const current=await response.json();
    if(!current||!Array.isArray(current.events)||!current.events.length) throw new Error("events.json invalid");
    return current;
  }catch(error){
    console.warn("Datele actualizate nu sunt disponibile; folosesc copia offline.",error);
    return fallback;
  }
}
async function init(){
  DATA=await loadData();
  document.getElementById("gen").textContent=`Date actualizate la ${DATA.generated}.`;
  renderNextRace();
  render();
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
}
globalThis.__appReady=init();
</script>
</body>
</html>
